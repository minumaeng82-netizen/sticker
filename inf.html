<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>스티커 체험 실시간 인원 현황</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background: #faf5ef;
      color: #362b24;
      font-family: system-ui, "Apple SD Gothic Neo", sans-serif;
    }

    main {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 820px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding: clamp(14px, 3vw, 24px);
      gap: clamp(12px, 2vw, 16px);
    }

    .error {
      white-space: pre-wrap;
      color: #a32236;
      overflow-wrap: anywhere;
      font-size: 16px;
      font-weight: 700;
    }

    .error:not(:empty) {
      padding: 12px 16px;
      border-radius: 14px;
      background: #fff0ef;
      border: 1px solid #f3c6cc;
    }

    .top-controls {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 18px;
      background: white;
      border: 1px solid #e6d8ca;
      box-shadow: 0 2px 8px #6c472308;
    }

    .nav-btn {
      min-width: 92px;
      min-height: 54px;
      padding: 10px 16px;
      border: 0;
      border-radius: 12px;
      background: #eee6df;
      color: #49372a;
      font: inherit;
      font-size: clamp(17px, 2.6vw, 20px);
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }

    .nav-btn:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .slot-select {
      width: 100%;
      min-width: 0;
      min-height: 54px;
      padding: 10px 14px;
      border: 1px solid #dfd1c3;
      border-radius: 12px;
      background: #faf5ef;
      color: #362b24;
      font: inherit;
      font-size: clamp(18px, 3vw, 22px);
      font-weight: 800;
      text-align: center;
    }

    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: clamp(18px, 3.5vw, 26px);
      border-radius: 22px;
      background: white;
      border: 2px solid #e6d8ca;
      box-shadow: 0 4px 16px #6c47230a;
    }

    .stage.has-people {
      border-color: #a9c8b3;
    }

    .stage.full {
      border-color: #e3a4b0;
    }

    .stage-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      padding-bottom: 16px;
      border-bottom: 2px dashed #eaded2;
    }

    .time-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }

    .time-label {
      font-size: 16px;
      font-weight: 700;
      color: #8b6c52;
    }

    #status {
      padding: 5px 12px;
      border-radius: 999px;
      background: #eee6df;
      color: #5a4638;
      font-size: 13px;
      font-weight: 700;
    }

    #status.live {
      background: #e6f4ec;
      color: #236440;
    }

    .big-time {
      display: block;
      font-size: clamp(36px, 7.5vw, 54px);
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .count-box {
      text-align: right;
    }

    .big-count {
      display: block;
      font-size: clamp(32px, 6.5vw, 44px);
      font-weight: 900;
      color: #805134;
    }

    .stage.full .big-count {
      color: #a32b3b;
    }

    .remain-text {
      font-size: clamp(16px, 2.8vw, 19px);
      font-weight: 800;
      color: #796557;
    }

    .roster {
      flex: 1;
      display: grid;
      grid-template-rows: repeat(6, minmax(66px, 1fr));
      gap: 12px;
      margin: 18px 0 0;
      padding: 0;
      list-style: none;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 18px;
      border-radius: 16px;
      background: #faf4ed;
      border: 1px solid #e8dccf;
    }

    .row.status-in_progress {
      background: #fffbeb;
      border-color: #f59e0b;
    }

    .row.status-completed {
      background: #f2f8f4;
      border-color: #b7d7c3;
      opacity: .84;
    }

    .row.empty {
      background: #fcfaf7;
      border: 1px dashed #dfd3c6;
      color: #a19182;
    }

    .num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #805134;
      color: white;
      font-size: 21px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .row.empty .num {
      background: #e5dad0;
      color: #8a796a;
    }

    .nickname {
      flex: 1;
      min-width: 0;
      font-size: clamp(26px, 5.2vw, 36px);
      font-weight: 900;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .row.empty .nickname {
      font-size: clamp(19px, 3.5vw, 24px);
      font-weight: 600;
    }

    .state-badge {
      padding: 7px 14px;
      border-radius: 999px;
      font-size: clamp(15px, 2.8vw, 19px);
      font-weight: 800;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .state-badge.waiting {
      background: #eee6df;
      color: #5a4638;
    }

    .state-badge.in_progress {
      background: #d97706;
      color: white;
    }

    .state-badge.completed {
      background: #2f7d52;
      color: white;
    }

    .phone-tail {
      padding: 8px 14px;
      border-radius: 12px;
      background: white;
      border: 1px solid #dfd1c3;
      color: #805134;
      font-size: clamp(22px, 4.4vw, 30px);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .qr-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 18px 22px;
      border-radius: 22px;
      background: white;
      border: 2px solid #dfd1c3;
      box-shadow: 0 4px 16px #6c47230a;
    }

    .qr-text {
      flex: 1;
      min-width: 0;
    }

    .qr-text strong {
      display: block;
      font-size: clamp(21px, 3.8vw, 27px);
      font-weight: 900;
      color: #805134;
      line-height: 1.35;
    }

    .qr-text p {
      margin: 6px 0 8px;
      font-size: clamp(15px, 2.6vw, 18px);
      color: #5a4638;
      line-height: 1.5;
    }

    .qr-url {
      display: inline-block;
      font-size: clamp(13px, 2.2vw, 16px);
      font-weight: 700;
      color: #7c6e61;
      word-break: break-all;
    }

    .qr-box {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 148px;
      height: 148px;
      padding: 8px;
      border-radius: 16px;
      background: white;
      border: 1px solid #e6d8ca;
      flex-shrink: 0;
    }

    .qr-box img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      color: #7c6e61;
      font-size: 14px;
      font-weight: 600;
    }

    .refresh-btn {
      min-height: 42px;
      padding: 8px 16px;
      border: 1px solid #dfd1c3;
      border-radius: 10px;
      background: white;
      color: #49372a;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    @media (max-width: 560px) {
      .top-controls {
        grid-template-columns: 1fr 1fr;
      }

      .slot-select {
        grid-column: 1 / -1;
        order: -1;
      }

      .stage-head {
        align-items: flex-start;
      }

      .count-box {
        text-align: left;
      }

      .row {
        flex-wrap: wrap;
        row-gap: 8px;
      }

      .nickname {
        flex: 1 1 calc(100% - 58px);
      }

      .qr-banner {
        flex-direction: column;
        text-align: center;
      }
    }
  </style>
</head>

<body>
  <main>
    <div id="error" class="error" role="alert"></div>

    <nav class="top-controls" aria-label="체험 시간대 이동">
      <button id="prev" class="nav-btn" type="button">‹ 이전</button>
      <select id="slot-select" class="slot-select" aria-label="체험 시간 선택"></select>
      <button id="next" class="nav-btn" type="button">다음 ›</button>
    </nav>

    <section id="stage" class="stage" aria-live="polite">
      <div class="stage-head">
        <div>
          <div class="time-meta">
            <span id="step-info" class="time-label"></span>
            <span id="status" role="status">연결 확인 중…</span>
          </div>
          <strong id="big-time" class="big-time">10:00~10:30</strong>
        </div>
        <div class="count-box">
          <strong id="big-count" class="big-count">0 / 6명</strong>
          <span id="remain-text" class="remain-text">잔여 6자리</span>
        </div>
      </div>

      <ol id="roster" class="roster"></ol>
    </section>

    <section class="qr-banner" aria-label="체험 신청 QR코드">
      <div class="qr-text">
        <strong>스마트폰으로 체험 신청하기</strong>
        <p>오른쪽 QR코드를 스캔하면 신청 페이지로 바로 이동합니다.</p>
        <span id="qr-link-text" class="qr-url">https://minumaeng82-netizen.github.io/sticker/</span>
      </div>
      <div id="qr-container" class="qr-box">
        <img id="qr-img" alt="체험 신청 페이지 QR코드">
      </div>
    </section>

    <div class="footer-bar">
      <span id="page-summary">전체 신청 0명 / 84자리</span>
      <button id="refresh" class="refresh-btn" type="button">새로고침</button>
    </div>
  </main>

  <script>
    'use strict';

    const SUPABASE_URL = 'https://epspxdkuwjvdfgzntgwa.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_i74UwJOH_Zm0AUk3cdTdvQ_Nm5T2mOe';
    const APPLY_URL = 'https://minumaeng82-netizen.github.io/sticker/';
    const TABLE = 'festival_sticker_reservations';
    const CAPACITY = 6;

    const STATUS_LABELS = {
      waiting: '대기',
      in_progress: '체험중',
      completed: '체험완료'
    };

    const SLOTS = Array.from({ length: 14 }, (_, i) => 600 + i * 30);
    const $ = id => document.getElementById(id);

    let db;
    let rows = [];
    let currentIndex = 0;
    let ready = false;
    let live = false;
    let loading = false;
    let again = false;
    let timer;

    function fmt(minutes) {
      return (
        String(Math.floor(minutes / 60)).padStart(2, '0') +
        ':' +
        String(minutes % 60).padStart(2, '0')
      );
    }

    function range(minutes) {
      return `${fmt(minutes)}~${fmt(minutes + 30)}`;
    }

    function bySlot(slot) {
      return rows.filter(r => Number(r.slot) === slot);
    }

    function itemStatus(item) {
      const s = item && item.status;
      return s === 'in_progress' || s === 'completed' ? s : 'waiting';
    }

    function showStatus() {
      const el = $('status');
      if (!ready) {
        el.textContent = '연결 확인 필요';
        el.className = '';
      } else if (live) {
        el.textContent = '● 실시간 연결됨';
        el.className = 'live';
      } else {
        el.textContent = '자동 새로고침 중';
        el.className = '';
      }
    }

    function buildSelectOptions() {
      const select = $('slot-select');
      const prevVal = String(currentIndex);
      select.replaceChildren();

      SLOTS.forEach((slot, idx) => {
        const count = bySlot(slot).length;
        const opt = document.createElement('option');
        opt.value = String(idx);
        opt.textContent = `${range(slot)} (${count}/${CAPACITY}명)`;
        select.append(opt);
      });

      select.value = prevVal;
    }

    function render() {
      buildSelectOptions();

      const slot = SLOTS[currentIndex];
      const list = bySlot(slot);
      const count = list.length;
      const isFull = count >= CAPACITY;

      $('prev').disabled = currentIndex <= 0;
      $('next').disabled = currentIndex >= SLOTS.length - 1;

      $('stage').className =
        'stage' +
        (count > 0 ? ' has-people' : '') +
        (isFull ? ' full' : '');

      $('step-info').textContent = `${currentIndex + 1} / ${SLOTS.length}번째 타임`;
      $('big-time').textContent = range(slot);
      $('big-count').textContent = ready ? `${count} / ${CAPACITY}명` : '확인 중';
      $('remain-text').textContent = ready
        ? (isFull ? '정원 마감' : `잔여 ${CAPACITY - count}자리`)
        : '현황을 불러오는 중입니다';

      $('page-summary').textContent = ready
        ? `전체 신청 ${rows.length}명 / ${SLOTS.length * CAPACITY}자리`
        : '연결 상태를 확인해 주세요';

      const roster = $('roster');
      roster.replaceChildren();

      for (let i = 0; i < CAPACITY; i++) {
        const item = list[i];
        const li = document.createElement('li');

        if (item) {
          const st = itemStatus(item);
          li.className = `row status-${st}`;

          const num = document.createElement('span');
          num.className = 'num';
          num.textContent = String(i + 1);

          const name = document.createElement('span');
          name.className = 'nickname';
          name.textContent = item.student_name || '';

          const badge = document.createElement('span');
          badge.className = `state-badge ${st}`;
          badge.textContent = STATUS_LABELS[st];

          const tail = document.createElement('span');
          tail.className = 'phone-tail';
          tail.textContent = item.phone_last4 || '번호 미등록';

          li.append(num, name, badge, tail);
        } else {
          li.className = 'row empty';

          const num = document.createElement('span');
          num.className = 'num';
          num.textContent = String(i + 1);

          const name = document.createElement('span');
          name.className = 'nickname';
          name.textContent = ready ? '빈 자리' : '확인 중…';

          li.append(num, name);
        }

        roster.append(li);
      }
    }

    async function load() {
      if (!db) return;
      if (loading) {
        again = true;
        return;
      }
      loading = true;

      try {
        const { data, error } = await db.rpc('festival_display_list');
        if (error) throw error;

        rows = Array.isArray(data) ? data : [];
        ready = true;
        $('error').textContent = '';
        render();
      } catch (err) {
        ready = false;
        $('error').textContent = '현황을 불러오지 못했습니다.\n' + (err && err.message ? err.message : String(err));
        render();
      } finally {
        loading = false;
        showStatus();
        if (again) {
          again = false;
          void load();
        }
      }
    }

    function initQrCode() {
      $('qr-link-text').textContent = APPLY_URL;
      const img = $('qr-img');
      img.onerror = () => {
        img.style.display = 'none';
      };
      img.src =
        'https://api.qrserver.com/v1/create-qr-code/?size=260x260&margin=4&data=' +
        encodeURIComponent(APPLY_URL);
    }

    $('prev').onclick = () => {
      if (currentIndex > 0) {
        currentIndex--;
        render();
      }
    };

    $('next').onclick = () => {
      if (currentIndex < SLOTS.length - 1) {
        currentIndex++;
        render();
      }
    };

    $('slot-select').onchange = event => {
      currentIndex = Number(event.target.value) || 0;
      render();
    };

    $('refresh').onclick = () => {
      void load();
    };

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) void load();
    });

    window.addEventListener('online', () => {
      void load();
    });

    initQrCode();
    render();
    showStatus();

    try {
      if (!window.supabase || typeof window.supabase.createClient !== 'function') {
        throw new Error('Supabase 스크립트를 불러오지 못했습니다. 네트워크를 확인해 주세요.');
      }

      db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      db.channel('festival-sticker-display-20261128')
        .on(
          'postgres_changes',
          { event: '*', schema: 'public', table: TABLE },
          () => {
            clearTimeout(timer);
            timer = setTimeout(() => { void load(); }, 150);
          }
        )
        .subscribe(state => {
          live = state === 'SUBSCRIBED';
          showStatus();
          if (live) void load();
        });

      void load();

      setInterval(() => {
        if (!document.hidden) void load();
      }, 15000);
    } catch (err) {
      ready = false;
      $('error').textContent = err && err.message ? err.message : String(err);
      showStatus();
      render();
    }
  </script>
</body>
</html>
