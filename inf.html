<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>스티커 체험 실시간 인원 현황</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #faf5ef;
      color: #362b24;
      font-family: system-ui, "Apple SD Gothic Neo", sans-serif;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 20px 16px 44px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 16px;
      padding: 26px 22px;
      border-radius: 22px;
      background: #805134;
      color: white;
    }

    header small {
      display: block;
      color: #ffdfa8;
      font-size: 17px;
      font-weight: 800;
    }

    h1 {
      margin: 8px 0 6px;
      font-size: clamp(26px, 4vw, 34px);
      line-height: 1.3;
    }

    header p {
      margin: 0;
      font-size: 15px;
      color: #f6ebe0;
    }

    .status-box {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    #status {
      padding: 7px 14px;
      border-radius: 999px;
      background: #603923;
      font-size: 13px;
      font-weight: 700;
    }

    button {
      min-height: 42px;
      padding: 10px 16px;
      border: 0;
      border-radius: 11px;
      background: #ffdfa8;
      color: #362b24;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .error {
      white-space: pre-wrap;
      color: #a32236;
      overflow-wrap: anywhere;
    }

    .error:not(:empty) {
      margin: 16px 0;
      padding: 14px;
      border-radius: 14px;
      background: #fff0ef;
    }

    .kpi {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin: 18px 0 22px;
    }

    .kpi-card {
      padding: 18px;
      border-radius: 16px;
      background: white;
      border: 1px solid #e6d8ca;
    }

    .kpi-card span {
      display: block;
      font-size: 14px;
      color: #796557;
    }

    .kpi-card strong {
      display: block;
      margin-top: 6px;
      font-size: 30px;
      color: #805134;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 18px;
      border-radius: 18px;
      background: white;
      border: 2px solid #e6d8ca;
    }

    .card.has-people {
      border-color: #a9c8b3;
      background: #f6fcf7;
    }

    .card.full {
      border-color: #e3a4b0;
      background: #fff2f4;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }

    .slot-time {
      font-size: 22px;
      font-weight: 800;
    }

    .slot-badge {
      font-size: 18px;
      font-weight: 800;
      color: #805134;
    }

    .card.full .slot-badge {
      color: #a32b3b;
    }

    .remain {
      font-size: 13px;
      color: #796557;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: auto;
    }

    .chip {
      padding: 6px 10px;
      border-radius: 999px;
      background: #faf4ed;
      border: 1px solid #e3d5c6;
      font-size: 14px;
      font-weight: 600;
    }

    .empty-note {
      font-size: 14px;
      color: #968576;
    }

    @media (max-width: 640px) {
      .kpi {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <div>
        <small>2026년 발명인공지능&amp;메이커 한마당</small>
        <h1>나만의 스티커 만들기 · 실시간 체험 현황</h1>
        <p>2026년 11월 28일 · 10:00~17:00 (타임당 30분 · 정원 8명)</p>
      </div>

      <div class="status-box">
        <div id="status" role="status" aria-live="polite">연결 확인 중…</div>
        <button id="refresh" type="button">새로고침</button>
      </div>
    </header>

    <div id="error" class="error" role="alert"></div>

    <section class="kpi" aria-label="전체 체험 요약">
      <div class="kpi-card">
        <span>전체 신청 인원</span>
        <strong id="kpi-total">0명</strong>
      </div>
      <div class="kpi-card">
        <span>전체 잔여 좌석</span>
        <strong id="kpi-remain">112자리</strong>
      </div>
      <div class="kpi-card">
        <span>정원 마감 타임</span>
        <strong id="kpi-full">0 / 14</strong>
      </div>
    </section>

    <section id="board" class="board" aria-label="시간대별 신청 현황"></section>
  </main>

  <script>
    'use strict';

    const SUPABASE_URL =
      'https://epspxdkuwjvdfgzntgwa.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_i74UwJOH_Zm0AUk3cdTdvQ_Nm5T2mOe';

    const TABLE = 'festival_sticker_reservations';

    // 10:00~10:30부터 16:30~17:00까지 30분 단위 총 14개 타임
    const SLOTS = Array.from(
      { length: 14 },
      (_, index) => 600 + index * 30
    );

    const CAPACITY_PER_SLOT = 8;
    const TOTAL_CAPACITY = SLOTS.length * CAPACITY_PER_SLOT;

    const $ = id => document.getElementById(id);

    let db;
    let rows = [];
    let ready = false;
    let live = false;
    let loading = false;
    let again = false;
    let timer;

    function fmt(minutes) {
      return (
        String(Math.floor(minutes / 60)).padStart(2, '0') +
        ':' +
        String(minutes % 60).padStart(2, '0')
      );
    }

    function range(minutes) {
      return `${fmt(minutes)}~${fmt(minutes + 30)}`;
    }

    function bySlot(slot) {
      return rows.filter(r => Number(r.slot) === slot);
    }

    function showStatus() {
      $('status').textContent = !ready
        ? '연결 확인 필요'
        : live
          ? '● 실시간 연결됨'
          : '자동 새로고침 중';
    }

    function render() {
      $('kpi-total').textContent = ready ? `${rows.length}명` : '확인 중';
      $('kpi-remain').textContent = ready
        ? `${Math.max(0, TOTAL_CAPACITY - rows.length)}자리`
        : '확인 중';

      const fullSlots = SLOTS.filter(
        s => bySlot(s).length >= CAPACITY_PER_SLOT
      ).length;

      $('kpi-full').textContent = ready
        ? `${fullSlots} / ${SLOTS.length}`
        : '확인 중';

      $('board').replaceChildren();

      for (const slot of SLOTS) {
        const list = bySlot(slot);
        const count = list.length;
        const isFull = count >= CAPACITY_PER_SLOT;

        const card = document.createElement('article');
        card.className =
          'card' +
          (count > 0 ? ' has-people' : '') +
          (isFull ? ' full' : '');

        const top = document.createElement('div');
        top.className = 'card-top';

        const timeEl = document.createElement('strong');
        timeEl.className = 'slot-time';
        timeEl.textContent = range(slot);

        const badgeEl = document.createElement('span');
        badgeEl.className = 'slot-badge';
        badgeEl.textContent = ready
          ? (isFull ? '마감' : `${count} / ${CAPACITY_PER_SLOT}명`)
          : '확인 중';

        top.append(timeEl, badgeEl);

        const remainEl = document.createElement('div');
        remainEl.className = 'remain';
        remainEl.textContent = ready
          ? (isFull ? '신청이 마감되었습니다' : `잔여 ${CAPACITY_PER_SLOT - count}자리`)
          : '현황을 불러오는 중입니다';

        card.append(top, remainEl);

        if (list.length > 0) {
          const chips = document.createElement('div');
          chips.className = 'chips';

          list.forEach((item, idx) => {
            const chip = document.createElement('span');
            chip.className = 'chip';
            chip.textContent = `${idx + 1}. ${item.student_name}`;
            chips.append(chip);
          });

          card.append(chips);
        } else if (ready) {
          const empty = document.createElement('div');
          empty.className = 'empty-note';
          empty.textContent = '신청 대기 중';
          card.append(empty);
        }

        $('board').append(card);
      }
    }

    async function load() {
      if (!db) return;

      if (loading) {
        again = true;
        return;
      }

      loading = true;

      try {
        const { data, error } = await db
          .from(TABLE)
          .select('id,slot,student_name,created_at')
          .in('slot', SLOTS)
          .order('created_at', { ascending: true })
          .order('id', { ascending: true });

        if (error) throw error;

        rows = data || [];
        ready = true;
        $('error').textContent = '';
        render();
      } catch (err) {
        ready = false;
        $('error').textContent = '현황을 불러오지 못했습니다.\n' + err.message;
        render();
      } finally {
        loading = false;
        showStatus();

        if (again) {
          again = false;
          void load();
        }
      }
    }

    $('refresh').onclick = () => {
      void load();
    };

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        void load();
      }
    });

    window.addEventListener('online', () => {
      void load();
    });

    render();

    try {
      if (!window.supabase) {
        throw new Error('Supabase 연결 프로그램을 불러오지 못했습니다.');
      }

      db = window.supabase.createClient(
        SUPABASE_URL.trim(),
        SUPABASE_KEY.trim()
      );

      db.channel('festival-sticker-display-20261128')
        .on(
          'postgres_changes',
          {
            event: '*',
            schema: 'public',
            table: TABLE
          },
          () => {
            clearTimeout(timer);
            timer = setTimeout(() => {
              void load();
            }, 150);
          }
        )
        .subscribe(state => {
          live = state === 'SUBSCRIBED';
          showStatus();
          if (live) {
            void load();
          }
        });

      void load();

      setInterval(() => {
        if (!document.hidden) {
          void load();
        }
      }, 15000);
    } catch (err) {
      $('error').textContent = err.message;
      showStatus();
    }
  </script>
</body>
</html>
