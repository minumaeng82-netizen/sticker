<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>스티커 체험 관리자</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f7f3ee;
      color: #352a23;
      font-family: system-ui, sans-serif;
    }

    main {
      max-width: 1050px;
      margin: auto;
      padding: 22px 15px;
    }

    h1 { font-size: 25px; line-height: 1.5; }

    section {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin: 16px 0;
    }

    input, select, button {
      font: inherit;
      padding: 12px;
      border: 1px solid #d9cfc4;
      border-radius: 9px;
      min-height: 46px;
    }

    input { max-width: 100%; }

    button {
      cursor: pointer;
      background: #805134;
      color: white;
    }

    button:disabled {
      opacity: .5;
      cursor: wait;
    }

    label {
      display: block;
      margin: 12px 0 6px;
    }

    #login { max-width: 450px; }
    #login input { width: 100%; }

    .bar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .bar input {
      flex: 1;
      min-width: 180px;
    }

    #message {
      white-space: pre-wrap;
      color: #a22b3b;
      overflow-wrap: anywhere;
    }

    .table { overflow: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      white-space: nowrap;
    }

    th, td {
      text-align: left;
      padding: 13px 9px;
      border-bottom: 1px solid #eee;
    }

    th { background: #faf4ed; }
    .delete { background: #a42b3b; }
    small { color: #776658; }

    #summary {
      font-size: 18px;
      font-weight: 700;
    }

    .hint {
      font-size: 13px;
      line-height: 1.8;
      color: #69594d;
    }

    [hidden] { display: none !important; }
  </style>
</head>

<body>
  <main>
    <h1>
      2026년 발명인공지능&amp;메이커 한마당<br>
      스티커 체험 관리자
    </h1>

    <p id="message" role="alert"></p>

    <section id="login">
      <h2>관리자 로그인</h2>

      <form id="login-form">
        <label for="email">이메일</label>

        <input
          id="email"
          type="email"
          autocomplete="username"
          required
        >

        <label for="password">비밀번호</label>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
        >

        <p>
          <button id="signin" type="submit">로그인</button>
        </p>
      </form>

      <small>
        학교에서 지정한 관리자 계정만 접근할 수 있습니다.
      </small>
    </section>

    <div id="panel" hidden>
      <section>
        <div class="bar">
          <strong id="account"></strong>
          <button id="reload" type="button">새로고침</button>
          <button id="logout" type="button">로그아웃</button>
        </div>

        <p id="sync" role="status"></p>

        <div class="bar">
          <select id="slot" aria-label="시간대 필터">
            <option value="">전체 시간대</option>
          </select>

          <input
            id="search"
            placeholder="별명 또는 연락처 검색"
            aria-label="별명 또는 연락처 검색"
          >

          <button id="csv" type="button">
            현재 명단 CSV
          </button>
        </div>

        <p id="summary"></p>

        <p class="hint">
          연락처는 관리자에게만 표시됩니다.
          CSV에도 개인정보가 포함됩니다.<br>
          보유 기간이 지나면 신청·연락처 기록과 내려받은 파일을
          파기하세요. 자동 파기는 설정되어 있지 않습니다.
        </p>
      </section>

      <section class="table">
        <table>
          <thead>
            <tr>
              <th>체험 시간</th>
              <th>별명</th>
              <th>연락처</th>
              <th>신청 일시</th>
              <th>동의 일시</th>
              <th>관리</th>
            </tr>
          </thead>

          <tbody id="rows"></tbody>
        </table>
      </section>
    </div>
  </main>

  <script>
    'use strict';

    const db = window.supabase.createClient(
      'https://epspxdkuwjvdfgzntgwa.supabase.co',
      'sb_publishable_i74UwJOH_Zm0AUk3cdTdvQ_Nm5T2mOe',
      {
        auth: {
          persistSession: false
        }
      }
    );

    const $ = id => document.getElementById(id);

    let items = [];
    let active = false;
    let channel = null;
    let timer = null;
    let loading = false;
    let pending = false;
    let live = false;
    let deleting = false;

    const time = n =>
      String(Math.floor(n / 60)).padStart(2, '0') +
      ':' +
      String(n % 60).padStart(2, '0');

    const range = n => time(n) + '~' + time(n + 20);

    const date = value =>
      value
        ? new Date(value).toLocaleString(
            'ko-KR',
            { timeZone: 'Asia/Seoul' }
          )
        : '기록 없음';

    for (let n = 580; n <= 1000; n += 20) {
      const option = document.createElement('option');
      option.value = n;
      option.textContent = range(n);
      $('slot').append(option);
    }

    function filtered() {
      const query = $('search').value.trim().toLowerCase();

      return items.filter(row => {
        const matchesSlot =
          !$('slot').value ||
          Number(row.slot) === Number($('slot').value);

        const matchesQuery =
          !query ||
          (row.nickname || '').toLowerCase().includes(query) ||
          (row.phone || '').includes(query.replace(/-/g, ''));

        return matchesSlot && matchesQuery;
      });
    }

    function render() {
      const data = filtered();

      $('rows').replaceChildren();

      $('summary').textContent =
        `전체 ${items.length}명 / 176자리 · ` +
        `현재 표시 ${data.length}명`;

      for (const row of data) {
        const tr = document.createElement('tr');

        const values = [
          range(Number(row.slot)),
          row.nickname,
          row.phone || '기록 없음',
          date(row.created_at),
          date(row.consent_at)
        ];

        for (const text of values) {
          const td = document.createElement('td');
          td.textContent = text;
          tr.append(td);
        }

        const td = document.createElement('td');
        const button = document.createElement('button');

        button.textContent = '삭제';
        button.className = 'delete';
        button.disabled = deleting;
        button.onclick = () => remove(row);

        td.append(button);
        tr.append(td);
        $('rows').append(tr);
      }

      if (!data.length) {
        const tr = document.createElement('tr');
        const td = document.createElement('td');

        td.colSpan = 6;
        td.textContent = '신청 내역이 없습니다.';

        tr.append(td);
        $('rows').append(tr);
      }
    }

    function stop() {
      active = false;
      items = [];
      render();

      $('panel').hidden = true;
      $('login').hidden = false;
      $('account').textContent = '';
      $('password').value = '';

      if (channel) {
        void db.removeChannel(channel);
        channel = null;
      }

      live = false;
    }

    async function load() {
      if (!active) return;

      if (loading) {
        pending = true;
        return;
      }

      loading = true;

      try {
        const { data, error } = await db.rpc(
          'festival_admin_list'
        );

        if (error) throw error;
        if (!active) return;

        items = data || [];
        $('message').textContent = '';

        render();

        $('sync').textContent =
          (live ? '● 실시간 연결 · ' : '자동 갱신 · ') +
          new Date().toLocaleTimeString('ko-KR') +
          ' 확인';
      } catch (error) {
        items = [];
        render();

        $('message').textContent = error.message;
        $('sync').textContent = '명단 조회 실패';
      } finally {
        loading = false;

        if (pending) {
          pending = false;
          void load();
        }
      }
    }

    async function connect(user) {
      const { data, error } = await db.rpc(
        'festival_admin_list'
      );

      if (error) throw error;

      items = data || [];
      active = true;

      $('login').hidden = true;
      $('panel').hidden = false;
      $('account').textContent = user.email;
      $('password').value = '';

      render();

      channel = db
        .channel('festival-admin')
        .on(
          'postgres_changes',
          {
            event: '*',
            schema: 'public',
            table: 'festival_sticker_reservations'
          },
          () => {
            clearTimeout(timer);
            timer = setTimeout(() => void load(), 150);
          }
        )
        .subscribe(state => {
          live = state === 'SUBSCRIBED';
          if (active) void load();
        });
    }

    $('login-form').onsubmit = async event => {
      event.preventDefault();

      $('signin').disabled = true;

      try {
        $('message').textContent = '';

        const { data, error } =
          await db.auth.signInWithPassword({
            email: $('email').value.trim(),
            password: $('password').value
          });

        if (error) throw error;

        await connect(data.user);
      } catch (error) {
        await db.auth.signOut();
        stop();

        $('message').textContent =
          '로그인 또는 관리자 권한 확인 실패: ' +
          error.message;
      } finally {
        $('signin').disabled = false;
      }
    };

    $('logout').onclick = async () => {
      stop();
      await db.auth.signOut();
    };

    db.auth.onAuthStateChange(event => {
      if (event === 'SIGNED_OUT') stop();
    });

    async function remove(row) {
      if (deleting) return;

      const confirmed = confirm(
        range(Number(row.slot)) +
        ' · ' +
        row.nickname +
        ' 신청과 연락처를 삭제할까요?'
      );

      if (!confirmed) return;

      deleting = true;
      render();

      try {
        const { error } = await db.rpc(
          'festival_admin_delete',
          { p_id: row.id }
        );

        if (error) throw error;

        await load();
      } catch (error) {
        alert(error.message);
      } finally {
        deleting = false;
        render();
      }
    }

    $('reload').onclick = () => void load();
    $('slot').onchange = render;
    $('search').oninput = render;

    $('csv').onclick = () => {
      // CSV 수식 실행 위험을 줄이기 위한 처리
      const safe = value =>
        '"' +
        String(value ?? '')
          .replace(/^[=+@\-\t\r]/, "'$&")
          .replace(/"/g, '""') +
        '"';

      const data = [
        [
          '체험 시간',
          '별명',
          '연락처',
          '신청 일시',
          '동의 일시',
          '동의 버전'
        ],

        ...filtered().map(row => [
          range(Number(row.slot)),
          row.nickname,
          row.phone,
          date(row.created_at),
          date(row.consent_at),
          row.consent_version
        ])
      ];

      const content = data
        .map(row => row.map(safe).join(','))
        .join('\r\n');

      const blob = new Blob(
        ['\ufeff' + content],
        { type: 'text/csv;charset=utf-8' }
      );

      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');

      link.href = url;
      link.download = '스티커체험_관리자명단.csv';
      link.click();

      setTimeout(() => URL.revokeObjectURL(url), 1000);
    };

    setInterval(() => {
      if (!document.hidden) void load();
    }, 15000);

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) void load();
    });

    window.addEventListener('online', () => void load());
  </script>
</body>
</html>
