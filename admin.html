<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>스티커 체험 관리자</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      background: #faf5ef;
      color: #362b24;
      font-family: system-ui, "Apple SD Gothic Neo", sans-serif;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 20px 14px 40px;
    }

    header {
      padding: 24px 20px;
      border-radius: 20px;
      background: #805134;
      color: white;
    }

    header p {
      margin: 0 0 8px;
      color: #ffe0aa;
      font-weight: 700;
      line-height: 1.6;
    }

    h1 {
      margin: 0;
      font-size: 27px;
      line-height: 1.5;
    }

    h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.5;
    }

    h3 {
      margin: 0;
      font-size: 19px;
    }

    section {
      margin-top: 16px;
      padding: 20px;
      border-radius: 16px;
      background: white;
    }

    button,
    input {
      min-height: 46px;
      padding: 12px 14px;
      border: 1px solid #dfd1c3;
      border-radius: 10px;
      font: inherit;
    }

    button {
      background: #eee6df;
      color: #49372a;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid #c79461;
      outline-offset: 2px;
    }

    .primary {
      border-color: #805134;
      background: #805134;
      color: white;
      font-weight: 700;
    }

    .danger {
      border-color: #f2cccc;
      background: #fff0f0;
      color: #a32b3b;
    }

    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .hint {
      color: #78685a;
      font-size: 13px;
      line-height: 1.8;
    }

    #message {
      margin: 0;
      color: #a32b3b;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #message:not(:empty) {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      background: #fff0f0;
    }

    #login {
      max-width: 460px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: 700;
      font-size: 14px;
    }

    #login input {
      width: 100%;
    }

    #signin {
      width: 100%;
      margin-top: 20px;
    }

    #account {
      overflow-wrap: anywhere;
    }

    #sync {
      margin: 12px 0 0;
      color: #78685a;
      font-size: 13px;
      line-height: 1.7;
    }

    .summary {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    .stat {
      flex: 1;
      padding: 16px;
      border-radius: 12px;
      background: #faf4ed;
    }

    .stat span {
      display: block;
      font-size: 13px;
      color: #78685a;
    }

    .stat strong {
      display: block;
      margin-top: 6px;
      font-size: 26px;
      color: #805134;
    }

    .section-title {
      margin: 26px 0 12px;
    }

    .hour-group {
      margin-bottom: 22px;
    }

    .hour-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 10px;
      padding: 0 3px;
    }

    .hour-title span {
      color: #78685a;
      font-size: 13px;
      font-weight: 400;
    }

    .slot-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .slot-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 124px;
      padding: 18px 12px;
      border: 1px solid #dfd1c3;
      border-radius: 14px;
      background: white;
      text-align: left;
    }

    .slot-card strong {
      font-size: 20px;
      white-space: nowrap;
    }

    .slot-card span {
      color: #805134;
      font-size: 15px;
      font-weight: 700;
    }

    .slot-card small {
      color: #897567;
      font-size: 12px;
    }

    .slot-card.full {
      border-color: #edb5bd;
      background: #fff2f3;
    }

    .slot-card.full span {
      color: #a32b3b;
    }

    .slot-card.selected {
      border: 2px solid #805134;
      background: #fff7eb;
      padding: 17px 11px;
    }

    #detail {
      scroll-margin-top: 15px;
    }

    #detail-count {
      color: #805134;
      font-weight: 700;
      font-size: 18px;
    }

    #search {
      width: 100%;
      margin: 5px 0 16px;
    }

    #people {
      display: grid;
      gap: 12px;
    }

    .person {
      padding: 16px;
      border: 1px solid #e8dccf;
      border-radius: 14px;
      background: #fffdf9;
    }

    .person-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .nickname {
      margin: 0;
      font-size: 23px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .phone {
      display: inline-block;
      margin-top: 10px;
      color: #805134;
      font-size: 21px;
      font-weight: 700;
      text-decoration: none;
    }

    .record {
      margin: 10px 0 0;
      color: #78685a;
      font-size: 12px;
      line-height: 1.9;
      overflow-wrap: anywhere;
    }

    .empty {
      padding: 24px 16px;
      border-radius: 12px;
      background: #faf4ed;
      color: #78685a;
      line-height: 1.8;
      text-align: center;
    }

    @media (max-width: 600px) {
      main {
        padding: 14px 10px 30px;
      }

      section {
        padding: 16px;
      }

      h1 {
        font-size: 23px;
      }

      .slot-grid {
        gap: 6px;
      }

      .slot-card {
        min-height: 112px;
        padding: 15px 7px;
      }

      .slot-card.selected {
        padding: 14px 6px;
      }

      .slot-card strong {
        font-size: 15px;
      }

      .slot-card span {
        font-size: 13px;
      }

      .slot-card small {
        font-size: 11px;
      }

      .stat {
        padding: 13px 10px;
      }

      .stat strong {
        font-size: 23px;
      }

      .nickname {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <p>2026년 발명인공지능&amp;메이커 한마당</p>
      <h1>스티커 만들기 체험 관리자</h1>
    </header>

    <p id="message" role="alert"></p>

    <section id="login">
      <h2>관리자 로그인</h2>

      <form id="login-form">
        <label for="email">이메일</label>

        <input
          id="email"
          type="email"
          autocomplete="username"
          required
        >

        <label for="password">비밀번호</label>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
        >

        <button
          id="signin"
          class="primary"
          type="submit"
        >
          로그인
        </button>
      </form>

      <p class="hint">
        Supabase에 등록하고 관리자 권한을 부여한 계정으로
        로그인하세요.
      </p>
    </section>

    <div id="panel" hidden>
      <section>
        <div class="bar">
          <strong id="account"></strong>

          <div class="buttons">
            <button id="reload" type="button">
              새로고침
            </button>

            <button id="logout" type="button">
              로그아웃
            </button>
          </div>
        </div>

        <p id="sync" role="status" aria-live="polite"></p>

        <div class="summary">
          <div class="stat">
            <span>전체 신청</span>
            <strong id="total">0명</strong>
          </div>

          <div class="stat">
            <span>잔여 자리</span>
            <strong id="remaining">176자리</strong>
          </div>

          <div class="stat">
            <span>마감 타임</span>
            <strong id="full-count">0개</strong>
          </div>
        </div>

        <div class="buttons" style="margin-top:16px">
          <button id="csv-all" type="button">
            전체 명단 CSV
          </button>
        </div>
      </section>

      <h2 class="section-title">
        11월 28일 · 시간대별 신청 현황
      </h2>

      <p class="hint">
        체험 시간을 누르면 해당 시간에 신청한 별명과 연락처가
        아래에 표시됩니다.
      </p>

      <div id="schedule"></div>

      <section id="detail" hidden>
        <div class="bar">
          <h2 id="detail-title"></h2>

          <button id="csv-slot" type="button">
            이 시간 명단 CSV
          </button>
        </div>

        <p id="detail-count"></p>

        <input
          id="search"
          type="search"
          placeholder="선택한 시간의 별명·연락처 검색"
          aria-label="선택한 시간의 별명 또는 연락처 검색"
        >

        <div id="people"></div>
      </section>

      <p class="hint">
        연락처는 지정된 관리자만 조회할 수 있습니다.
        다운로드한 CSV에도 개인정보가 포함됩니다.<br>
        보유 기간이 지난 신청 기록과 다운로드 파일은 파기하세요.
        자동 파기는 설정되어 있지 않습니다.
      </p>
    </div>
  </main>

  <script>
    'use strict';

    const SUPABASE_URL =
      'https://epspxdkuwjvdfgzntgwa.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_i74UwJOH_Zm0AUk3cdTdvQ_Nm5T2mOe';

    const $ = id => document.getElementById(id);

    const ALL_SLOTS = Array.from(
      { length: 22 },
      (_, index) => 580 + index * 20
    );

    let db;
    let items = [];
    let selectedSlot = null;

    let active = false;
    let ready = false;
    let live = false;
    let channel = null;

    let loading = false;
    let reloadRequested = false;
    let deleting = false;
    let refreshTimer;

    // ログアウト後に古い取得結果を表示しないための世代番号
    let sessionVersion = 0;

    function makeElement(tag, className, text) {
      const element = document.createElement(tag);

      if (className) {
        element.className = className;
      }

      if (text !== undefined) {
        element.textContent = text;
      }

      return element;
    }

    function time(minutes) {
      return (
        String(Math.floor(minutes / 60)).padStart(2, '0') +
        ':' +
        String(minutes % 60).padStart(2, '0')
      );
    }

    function range(minutes) {
      return `${time(minutes)}~${time(minutes + 20)}`;
    }

    function hourLabel(hour) {
      if (hour < 12) return `${hour}시`;
      if (hour === 12) return '12시';
      return `오후 ${hour - 12}시`;
    }

    function dateLabel(value) {
      if (!value) return '기록 없음';

      return new Date(value).toLocaleString(
        'ko-KR',
        { timeZone: 'Asia/Seoul' }
      );
    }

    function orderedRows(data) {
      return [...data].sort((a, b) => {
        const slotDifference =
          Number(a.slot) - Number(b.slot);

        if (slotDifference !== 0) {
          return slotDifference;
        }

        return String(a.nickname || '').localeCompare(
          String(b.nickname || ''),
          'ko'
        );
      });
    }

    function rowsForSlot(slot) {
      return orderedRows(
        items.filter(row => Number(row.slot) === slot)
      );
    }

    function filteredSlotRows() {
      if (selectedSlot === null) return [];

      const query = $('search').value
        .trim()
        .toLowerCase();

      const phoneQuery = query.replace(/[^0-9]/g, '');

      return rowsForSlot(selectedSlot).filter(row => {
        if (!query) return true;

        const matchesNickname = String(
          row.nickname || ''
        ).toLowerCase().includes(query);

        const matchesPhone =
          phoneQuery.length > 0 &&
          String(row.phone || '')
            .replace(/[^0-9]/g, '')
            .includes(phoneQuery);

        return matchesNickname || matchesPhone;
      });
    }

    function render() {
      $('total').textContent =
        ready ? `${items.length}명` : '확인 필요';

      $('remaining').textContent = ready
        ? `${Math.max(0, 176 - items.length)}자리`
        : '확인 필요';

      const fullCount = ALL_SLOTS.filter(
        slot => rowsForSlot(slot).length >= 8
      ).length;

      $('full-count').textContent =
        ready ? `${fullCount}개` : '확인 필요';

      $('csv-all').disabled = !ready;

      renderSchedule();
      renderDetail();
    }

    function renderSchedule() {
      $('schedule').replaceChildren();

      for (let hour = 9; hour <= 16; hour++) {
        const slots = ALL_SLOTS.filter(
          slot => Math.floor(slot / 60) === hour
        );

        const group = makeElement(
          'div',
          'hour-group'
        );

        const heading = makeElement(
          'div',
          'hour-title'
        );

        const used = slots.reduce(
          (sum, slot) => sum + rowsForSlot(slot).length,
          0
        );

        heading.append(
          makeElement('h3', '', hourLabel(hour)),
          makeElement(
            'span',
            '',
            ready
              ? `${used}명 / ${slots.length * 8}자리`
              : '연결 확인 필요'
          )
        );

        const grid = makeElement(
          'div',
          'slot-grid'
        );

        for (const slot of slots) {
          const count = rowsForSlot(slot).length;

          const button = makeElement(
            'button',
            'slot-card' +
            (count >= 8 ? ' full' : '') +
            (selectedSlot === slot ? ' selected' : '')
          );

          button.type = 'button';
          button.disabled = !ready;

          button.setAttribute(
            'aria-pressed',
            String(selectedSlot === slot)
          );

          button.append(
            makeElement('strong', '', range(slot)),
            makeElement(
              'span',
              '',
              ready
                ? `${count}명 / 8명`
                : '확인 필요'
            ),
            makeElement(
              'small',
              '',
              !ready
                ? '연결을 확인해 주세요'
                : count >= 8
                  ? '마감 · 명단 확인'
                  : `잔여 ${8 - count}자리 · 명단 확인`
            )
          );

          button.onclick = () => {
            selectedSlot = slot;
            $('search').value = '';

            renderSchedule();
            renderDetail();

            $('detail').scrollIntoView({
              behavior: 'smooth',
              block: 'start'
            });
          };

          grid.append(button);
        }

        group.append(heading, grid);
        $('schedule').append(group);
      }
    }

    function renderDetail() {
      $('detail').hidden = selectedSlot === null;

      if (selectedSlot === null) return;

      $('detail-title').textContent =
        `${range(selectedSlot)} 신청자`;

      $('csv-slot').disabled = !ready;

      const allRows = rowsForSlot(selectedSlot);
      const visibleRows = filteredSlotRows();

      $('detail-count').textContent = ready
        ? `신청 ${allRows.length}명 / 정원 8명` +
          ($('search').value.trim()
            ? ` · 검색 결과 ${visibleRows.length}명`
            : '')
        : '최신 명단을 불러오지 못했습니다.';

      $('people').replaceChildren();

      if (!ready) {
        $('people').append(
          makeElement(
            'div',
            'empty',
            '연결을 확인한 뒤 새로고침해 주세요.'
          )
        );
        return;
      }

      if (!visibleRows.length) {
        $('people').append(
          makeElement(
            'div',
            'empty',
            allRows.length
              ? '검색 결과가 없습니다.'
              : '이 시간대에는 신청자가 없습니다.'
          )
        );
        return;
      }

      for (const row of visibleRows) {
        const card = makeElement(
          'article',
          'person'
        );

        const head = makeElement(
          'div',
          'person-head'
        );

        const nickname = makeElement(
          'p',
          'nickname',
          row.nickname || '별명 없음'
        );

        const deleteButton = makeElement(
          'button',
          'danger',
          '삭제'
        );

        deleteButton.type = 'button';
        deleteButton.disabled = deleting;
        deleteButton.onclick = () => removeReservation(row);

        head.append(nickname, deleteButton);
        card.append(head);

        if (row.phone) {
          const phone = makeElement(
            'a',
            'phone',
            row.phone
          );

          phone.href =
            'tel:' + String(row.phone).replace(/[^0-9+]/g, '');

          card.append(phone);
        } else {
          card.append(
            makeElement(
              'div',
              'phone',
              '연락처 기록 없음'
            )
          );
        }

        const record = makeElement(
          'p',
          'record'
        );

        record.append(
          document.createTextNode(
            `신청: ${dateLabel(row.created_at)}`
          ),
          document.createElement('br'),
          document.createTextNode(
            `동의: ${dateLabel(row.consent_at)}`
          )
        );

        card.append(record);
        $('people').append(card);
      }
    }

    function clearSession() {
      sessionVersion++;
      active = false;
      ready = false;
      live = false;

      items = [];
      selectedSlot = null;
      reloadRequested = false;

      clearTimeout(refreshTimer);

      if (channel && db) {
        void db.removeChannel(channel);
        channel = null;
      }

      $('search').value = '';
      $('password').value = '';
      $('account').textContent = '';
      $('sync').textContent = '';

      $('panel').hidden = true;
      $('login').hidden = false;

      render();
    }

    async function load() {
      if (!db || !active) return;

      if (loading) {
        reloadRequested = true;
        return;
      }

      const version = sessionVersion;
      loading = true;

      try {
        const { data, error } = await db.rpc(
          'festival_admin_list'
        );

        if (version !== sessionVersion || !active) {
          return;
        }

        if (error) throw error;

        items = orderedRows(data || []);
        ready = true;

        $('message').textContent = '';
        $('sync').textContent =
          (live ? '● 실시간 연결 · ' : '자동 갱신 · ') +
          new Date().toLocaleTimeString('ko-KR') +
          ' 확인';

        render();
      } catch (error) {
        if (version !== sessionVersion || !active) {
          return;
        }

        items = [];
        ready = false;

        $('message').textContent =
          '명단 조회 실패: ' + error.message;

        $('sync').textContent = '연결 확인 필요';
        render();
      } finally {
        loading = false;

        if (reloadRequested) {
          reloadRequested = false;

          if (active) {
            void load();
          }
        }
      }
    }

    async function connect(user) {
      const version = ++sessionVersion;

      const { data, error } = await db.rpc(
        'festival_admin_list'
      );

      if (version !== sessionVersion) return;
      if (error) throw error;

      items = orderedRows(data || []);
      active = true;
      ready = true;

      $('login').hidden = true;
      $('panel').hidden = false;
      $('account').textContent = user.email;
      $('password').value = '';
      $('message').textContent = '';

      render();

      channel = db
        .channel('festival-admin-time-slots')
        .on(
          'postgres_changes',
          {
            event: '*',
            schema: 'public',
            table: 'festival_sticker_reservations'
          },
          () => {
            clearTimeout(refreshTimer);

            refreshTimer = setTimeout(() => {
              void load();
            }, 150);
          }
        )
        .subscribe(state => {
          if (
            version !== sessionVersion ||
            !active
          ) {
            return;
          }

          live = state === 'SUBSCRIBED';

          if (live) {
            void load();
          } else {
            $('sync').textContent =
              '실시간 연결 복구 중 · 15초 간격 자동 갱신';
          }
        });

      $('sync').textContent =
        '연결됨 · 시간대를 선택해 주세요.';
    }

    async function removeReservation(row) {
      if (!active || !ready || deleting) return;

      const confirmed = confirm(
        `${range(Number(row.slot))}\n` +
        `${row.nickname}\n\n` +
        '이 신청과 연결된 연락처를 삭제할까요?'
      );

      if (!confirmed) return;

      deleting = true;
      renderDetail();

      try {
        const { error } = await db.rpc(
          'festival_admin_delete',
          { p_id: row.id }
        );

        if (error) throw error;

        await load();
      } catch (error) {
        alert(
          '삭제하지 못했습니다: ' + error.message
        );
      } finally {
        deleting = false;
        renderDetail();
      }
    }

    function downloadCsv(data, filename) {
      if (!active || !ready) return;

      function safeCell(value) {
        let text = String(value ?? '');

        // 엑셀에서 사용자 입력이 수식으로 실행되는 위험을 줄입니다.
        if (/^\s*[=+@\-\t\r]/.test(text)) {
          text = "'" + text;
        }

        return '"' + text.replace(/"/g, '""') + '"';
      }

      const table = [
        [
          '체험 시간',
          '별명',
          '연락처',
          '신청 일시',
          '동의 일시',
          '동의 버전'
        ],

        ...orderedRows(data).map(row => [
          range(Number(row.slot)),
          row.nickname,
          row.phone,
          dateLabel(row.created_at),
          dateLabel(row.consent_at),
          row.consent_version
        ])
      ];

      const content = table
        .map(row => row.map(safeCell).join(','))
        .join('\r\n');

      const blob = new Blob(
        ['\ufeff' + content],
        { type: 'text/csv;charset=utf-8' }
      );

      const objectUrl = window.URL.createObjectURL(blob);

      const link = document.createElement('a');
      link.href = objectUrl;
      link.download = filename;

      document.body.append(link);
      link.click();
      link.remove();

      setTimeout(() => {
        window.URL.revokeObjectURL(objectUrl);
      }, 1000);
    }

    $('login-form').onsubmit = async event => {
      event.preventDefault();

      if (!db) {
        $('message').textContent =
          '연결 프로그램을 불러오지 못했습니다. 새로고침해 주세요.';
        return;
      }

      $('signin').disabled = true;
      $('signin').textContent = '로그인 중…';

      try {
        $('message').textContent = '';

        const { data, error } =
          await db.auth.signInWithPassword({
            email: $('email').value.trim(),
            password: $('password').value
          });

        if (error) throw error;

        await connect(data.user);
      } catch (error) {
        clearSession();

        try {
          await db.auth.signOut();
        } catch (_) {
          // 화면의 로그인 정보는 이미 제거했습니다.
        }

        $('message').textContent =
          '로그인 또는 관리자 권한 확인 실패: ' +
          error.message;
      } finally {
        $('signin').disabled = false;
        $('signin').textContent = '로그인';
      }
    };

    $('logout').onclick = async () => {
      clearSession();

      const { error } = await db.auth.signOut();

      if (error) {
        $('message').textContent =
          '화면에서 로그아웃했습니다. 서버 연결 종료 확인 실패: ' +
          error.message;
      }
    };

    $('reload').onclick = () => {
      void load();
    };

    $('search').oninput = renderDetail;

    $('csv-all').onclick = () => {
      downloadCsv(
        items,
        '스티커체험_전체_시간대별명단.csv'
      );
    };

    $('csv-slot').onclick = () => {
      if (selectedSlot === null) return;

      downloadCsv(
        filteredSlotRows(),
        `스티커체험_${time(selectedSlot).replace(':', '')}_명단.csv`
      );
    };

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        void load();
      }
    });

    window.addEventListener('online', () => {
      void load();
    });

    try {
      if (!window.supabase) {
        throw new Error(
          'Supabase 연결 프로그램을 불러오지 못했습니다.'
        );
      }

      db = window.supabase.createClient(
        SUPABASE_URL.trim(),
        SUPABASE_KEY.trim(),
        {
          auth: {
            persistSession: false
          }
        }
      );

      db.auth.onAuthStateChange(event => {
        if (event === 'SIGNED_OUT') {
          clearSession();
        }
      });

      setInterval(() => {
        if (!document.hidden) {
          void load();
        }
      }, 15000);
    } catch (error) {
      $('message').textContent =
        error.message + ' 인터넷 연결 후 새로고침해 주세요.';

      $('signin').disabled = true;
    }
  </script>
</body>
</html>
